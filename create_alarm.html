<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Way Better Alarm</title>

</head>
<body>
  <h1>What time would you like to wake up?</h1>

   
  <form action="#" onsubmit="event.preventDefault(); proceedToSelectAudio();">
    <label for="alarm-time">Alarm Time:</label>
    <input type="time" id="alarm-time" name="alarm-time" required>      
  </form>

  <div class="button-container">
    <button class="button" onclick="proceedToSelectAudio()">Next</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
