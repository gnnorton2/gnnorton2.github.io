<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Way Better Alarm</title>
</head>
<body>
  <h1>Select Audio From Spotify</h1>
  <div class="button-container">
    <button class="button" id="spotify-login" onclick="SpotifyLogin()">Connect to Spotify</button>
  </div>

  <div class="search-container">
    <input type="text" id="search-query" placeholder="What do you want to hear..." />
    <button class="button" onclick="searchSpotify()">Search Spotify</button>
    <button class="button" onclick="completeAlarmCreation()">Finish</button>
  </div>

  <div id="search-results" style="margin-top: 15px;"></div>

  <script src="script.js"></script>
</body>
</html>
